{% extends "base.html" %}
{% block title %}팀 관리 - PointBook{% endblock %}
{% block content %}
<h1>팀 관리</h1>
{% if error %}<p class="alert alert-error">{{ error }}</p>{% endif %}

<div class="card">
  <h2>팀 목록</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>팀</th><th>색상</th><th>인원</th><th></th></tr></thead>
      <tbody>
      {% for team in teams %}
        <tr>
          <td>{{ team.name }}</td>
          <td><span class="badge" style="background: {{ team.color }}">{{ team.color }}</span></td>
          <td>{{ team.persons|length }}</td>
          <td>
            <form method="post" action="/teams/{{ team.id }}/delete" onsubmit="return confirm('팀 \'{{ team.name }}\' 을(를) 삭제할까요? (소속 인원은 팀 없음으로 변경됩니다)')">
              <button type="submit" class="btn btn-sm btn-danger">삭제</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="4" class="muted">등록된 팀이 없습니다.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<div class="card">
  <h2>팀 추가</h2>
  <form method="post" action="/teams">
    <label>팀 이름
      <input type="text" name="name" required maxlength="50" placeholder="예: 1팀, 구조대">
    </label>
    <label>색상
      <select name="color">
        {% for c in colors %}
        <option value="{{ c }}" {% if loop.first %}selected{% endif %}>색상 {{ loop.index }} ({{ c }})</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit" class="btn btn-primary">추가</button>
  </form>
</div>
{% endblock %}
