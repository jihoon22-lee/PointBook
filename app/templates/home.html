{% extends "base.html" %}
{% block title %}PointBook 홈{% endblock %}
{% block content %}
<h1>PointBook</h1>
<p class="muted">소방서 포인트 충전 요청서 관리 서비스</p>
<div class="card-grid">
  <a class="card card-link" href="/people">
    <h2>인원 관리</h2>
    <p>재직/비재직, 팀, 잔액 조회 및 개별 수정</p>

  <a class="card card-link" href="/teams">

    <p>팀 마스터 추가/삭제, 색상 구분</p>

  <a class="card card-link" href="/monthly">

    <p>요청서 사진 인식 → 검수 → 동기화 · 잔액 계산</p>

  <a class="card card-link" href="/dashboard">
    <h2>대시보드</h2>
    <p>월별 사용량·잔액 통계, 월별 이력</p>

</div>
<p><a class="btn" href="/dashboard?account_type=shared&scope=as_of">공용 계정 월별·잔액 보고서</a> <a class="btn" href="/drafts">저장한 초안 이어하기</a></p>
{% endblock %}
