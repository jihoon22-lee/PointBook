{% extends "base.html" %}
{% block title %}{{ '인원 수정' if person else '인원 추가' }} - PointBook{% endblock %}
{% block content %}
<h1>{{ '인원 수정' if person else '인원 추가' }}</h1>
{% if error %}<p class="alert alert-error">{{ error }}</p>{% endif %}

<div class="card">
  <form method="post" action="{{ '/people/%d/edit' % person.id if person else '/people/new' }}">
    <label>개인번호 *
      <input type="text" name="personal_no" required value="{{ person.personal_no if person else '' }}" placeholder="예: 901234">
    </label>
    <label>이름 *
      <input type="text" name="name" required value="{{ person.name if person else '' }}">
    </label>
    <label>계급
      <input type="text" name="grade" value="{{ person.grade if person else '' }}" placeholder="예: 소방위">
    </label>
    <label>팀
      <select name="team_id">
        <option value="">팀 없음</option>
        {% for team in teams %}
        <option value="{{ team.id }}" {% if person and person.team_id == team.id %}selected{% endif %}>{{ team.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>상태
      <select name="status">
        <option value="active" {% if not person or person.status == 'active' %}selected{% endif %}>재직</option>
        <option value="inactive" {% if person and person.status == 'inactive' %}selected{% endif %}>비재직</option>
      </select>
    </label>
    <label>이월 잔액 (원)
      <input type="number" name="carry_balance" min="0" step="100" value="{{ person.current_carry_balance if person else 0 }}">
    </label>
    <label>당월 충전 금액 (원)
      <input type="number" name="amount" min="0" step="100" value="{{ person.current_amount if person else 0 }}">
    </label>
    <button type="submit" class="btn btn-primary">{{ '저장' if person else '추가' }}</button>
    <a class="btn" href="{{ '/people/%d' % person.id if person else '/people' }}">취소</a>
  </form>
</div>
<p class="muted">* 이월 잔액·충전 금액은 언제든 수정할 수 있으며, 월간 처리 후에는 <a href="{{ '/people/%d' % person.id if person else '/people' }}">인원 상세</a>의 "잔액 개별 수정"에서도 변경할 수 있습니다.</p>
{% endblock %}
