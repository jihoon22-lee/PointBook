name: pointbook

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${POINTBOOK_IMAGE:-${COMPOSE_PROJECT_NAME:-pointbook}:${POINTBOOK_VERSION:-local}}
    init: true
    user: "${POINTBOOK_UID:-1000}:${POINTBOOK_GID:-1000}"
    restart: unless-stopped
    env_file:
      - path: ${POINTBOOK_ENV_FILE:-.env}
        required: false
    environment:
      POINTBOOK_ENV_FILE: ""
      DATABASE_PATH: /app/data/pointbook.db
      BACKUP_DIR: /app/backups
    volumes:
      - "${POINTBOOK_DATA_DIR:-./data}:/app/data"
      - "${POINTBOOK_BACKUP_DIR:-${POINTBOOK_DATA_DIR:-./data}/backups}:/app/backups"
    ports:
      - "127.0.0.1:${POINTBOOK_PORT:-8002}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
