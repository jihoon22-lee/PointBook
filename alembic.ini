[alembic]
# script_location 은 앱에서 app/db.py가 절대경로로 재설정한다.
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url 은 migrations/env.py가 app 설정에서 읽는다 (여기서는 빈 값).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
