[project]
name = "pointbook"
version = "0.1.0"
description = "소방서 포인트 충전 요청서 관리 웹서비스"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.7",
    "werkzeug>=3.1",
    "openpyxl>=3.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pip-audit>=2.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/templates/*", "app/static/*"]

[tool.coverage.report]
fail_under = 85

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
