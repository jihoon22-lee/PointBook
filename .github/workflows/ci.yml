name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 최소 권한 원칙: 기본 권한을 read로 제한 (secret-scan은 job 레벨에서 확대)
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run mypy app

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - name: 마이그레이션 검증 (빈 DB upgrade head + 드리프트 확인)
        run: |
          export DATABASE_PATH=/tmp/ci_pointbook.db
          uv run alembic upgrade head
          uv run alembic check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run pip-audit

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Run E2E (구버전 Chromium)
        if: hashFiles('e2e/**') != ''
        working-directory: e2e
        run: docker compose -f compose.yml up --build --abort-on-container-exit --exit-code-from e2e

  quality-gate:
    name: Quality gate
    needs: [lint, typecheck, test, migrations, security, secret-scan, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 단일 필수 체크로 모아 두면, 게이팅으로 건너뛴 잡(skipped)은 통과로
      # 취급하고 실패·취소만 잡을 수 있다.
      - name: Verify no job failed
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "잡 결과: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "품질 게이트 실패: $result" >&2; exit 1 ;;
            esac
          done
