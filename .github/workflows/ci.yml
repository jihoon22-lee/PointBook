name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 최소 권한 원칙: 기본 권한을 read로 제한 (secret-scan은 job 레벨에서 확대)
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run mypy app scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - name: 마이그레이션 검증 (빈 DB upgrade head + 드리프트 확인)
        run: |
          export DATABASE_PATH=/tmp/ci_pointbook.db
          uv run alembic upgrade head
          uv run alembic check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run pip-audit

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Run E2E (구버전 Chromium)
        working-directory: e2e
        run: docker compose -f compose.yml up --build --abort-on-container-exit --exit-code-from e2e
      - name: Run production Compose smoke test
        run: bash e2e/production-smoke.sh

  quality-gate:
    name: Quality gate
    needs: [lint, typecheck, test, migrations, security, secret-scan, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 필수 7개 잡은 모두 실행·성공해야 한다. skipped·취소·빈 결과도 실패다.
      - name: Verify all required jobs succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "잡 결과: $RESULTS"
          if [ "$RESULTS" != "success success success success success success success" ]; then
            echo "품질 게이트 실패: 필수 7개 잡이 모두 성공해야 합니다." >&2
            exit 1
          fi
